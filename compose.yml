services:
  orbit:
    image: ${ORBIT_IMAGE:-ghcr.io/jhxxr/occ:latest}
    ports:
      - "${ORBIT_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Set ENCRYPTION_SECRET}
      AUTH_USERNAME: ${AUTH_USERNAME:?Set AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      DEFAULT_USD_CNY: ${DEFAULT_USD_CNY:-7.2}
      # 自动同步开关在「设置 → 自动同步」里（默认关闭）；
      # 设成 false 可从环境变量硬关，即使数据库里开着也不跑。
      AUTO_SYNC_ENABLED: ${AUTO_SYNC_ENABLED:-true}
      USAGE_RETENTION_ENABLED: ${USAGE_RETENTION_ENABLED:-true}
      USAGE_RAW_RETENTION_DAYS: ${USAGE_RAW_RETENTION_DAYS:-30}
      USAGE_DETAIL_RETENTION_DAYS: ${USAGE_DETAIL_RETENTION_DAYS:-90}
      USAGE_ARCHIVE_DIR: /app/data/usage-archives
    volumes:
      - ./data:/app/data
    restart: unless-stopped
